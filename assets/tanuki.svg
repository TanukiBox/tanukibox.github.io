<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Tanuki Box">
  <g stroke="#4a2d1a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 耳 -->
    <path d="M26 44 Q20 18 42 26 Z" fill="#5e3a1f"/>
    <path d="M94 44 Q100 18 78 26 Z" fill="#5e3a1f"/>
    <!-- 頭 -->
    <ellipse cx="60" cy="58" rx="40" ry="33" fill="#c08a55"/>
    <!-- 目のまわりの黒いもよう -->
    <path d="M22 60 Q30 44 48 50 Q58 54 60 60 Q62 54 72 50 Q90 44 98 60 Q92 72 76 70 Q64 68 60 64 Q56 68 44 70 Q28 72 22 60 Z" fill="#5e3a1f" stroke-width="0"/>
    <!-- 口もと -->
    <ellipse cx="60" cy="74" rx="17" ry="12" fill="#fff6e2" stroke-width="0"/>
    <!-- 頭の輪郭（上から） -->
    <ellipse cx="60" cy="58" rx="40" ry="33" fill="none"/>
    <!-- 目 -->
    <circle cx="44" cy="59" r="7" fill="#fff" stroke-width="3"/>
    <circle cx="76" cy="59" r="7" fill="#fff" stroke-width="3"/>
    <circle cx="45" cy="60" r="3.6" fill="#4a2d1a" stroke-width="0"/>
    <circle cx="77" cy="60" r="3.6" fill="#4a2d1a" stroke-width="0"/>
    <circle cx="46.5" cy="58" r="1.4" fill="#fff" stroke-width="0"/>
    <circle cx="78.5" cy="58" r="1.4" fill="#fff" stroke-width="0"/>
    <!-- 鼻 -->
    <ellipse cx="60" cy="69" rx="5.5" ry="4" fill="#4a2d1a" stroke-width="0"/>
    <!-- ほっぺ -->
    <ellipse cx="33" cy="72" rx="5" ry="3" fill="#ff9ea0" stroke-width="0" opacity="0.8"/>
    <ellipse cx="87" cy="72" rx="5" ry="3" fill="#ff9ea0" stroke-width="0" opacity="0.8"/>
    <!-- 箱（ふた） -->
    <path d="M14 82 L6 70 L40 78 Z" fill="#e3ae63"/>
    <path d="M106 82 L114 70 L80 78 Z" fill="#e3ae63"/>
    <!-- 箱（前の面） -->
    <rect x="14" y="80" width="92" height="34" rx="4" fill="#f3cf8e"/>
    <path d="M14 90 H106" stroke-width="3" opacity="0.35"/>
    <!-- 前足 -->
    <ellipse cx="42" cy="81" rx="9" ry="6" fill="#5e3a1f"/>
    <ellipse cx="78" cy="81" rx="9" ry="6" fill="#5e3a1f"/>
  </g>
